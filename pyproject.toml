[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esports-data"
version = "0.1.0"
description = "Privacy-safe school esports data contracts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
esports-data = "esports_data.cli:main"

[project.optional-dependencies]
operations = [
    "jsonschema==4.23.0",
    "pypdf==5.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
pattern = "test*.py"
top-level-directory = "."

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
