name: Controlled mutation promotion

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected environment name configured by repository administrators
        required: true
        type: choice
        options: [staging, production]
      target_ref:
        description: Protected target ref
        required: true
        type: choice
        options: [refs/heads/main]
      candidate_ref:
        description: Candidate ref containing one paired mutation commit
        required: true
        type: string
      database_path:
        description: Repository-relative SQLite checkpoint path in the candidate tree
        required: true
        type: string
      receipt_path:
        description: Repository-relative command receipt path in the candidate tree
        required: true
        type: string
      command_id:
        description: Applied mutation idempotency key
        required: true
        type: string
      report_path:
        description: Optional repository-relative PII-free report path in the candidate tree
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: esports-data-control-plane
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: Configure authenticated origin for the single coordinator invocation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Validate and atomically promote the paired candidate commit
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          TARGET_REF: ${{ inputs.target_ref }}
          DATABASE_PATH: ${{ inputs.database_path }}
          RECEIPT_PATH: ${{ inputs.receipt_path }}
          COMMAND_ID: ${{ inputs.command_id }}
          REPORT_PATH: ${{ inputs.report_path }}
        run: |
          set -euo pipefail
          case "$TARGET_REF" in refs/heads/main) ;; *) exit 1 ;; esac
          arguments=(promote-mutation --candidate-ref "$CANDIDATE_REF" --target-ref "$TARGET_REF" --database "$DATABASE_PATH" --receipt "$RECEIPT_PATH" --command-id "$COMMAND_ID")
          if [ -n "$REPORT_PATH" ]; then arguments+=(--report "$REPORT_PATH"); fi
          python -m esports_data.cli "${arguments[@]}"
