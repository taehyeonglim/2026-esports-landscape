<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학교 e스포츠 자료 검토</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body>
<header><p>학교 e스포츠 지형도 · 로컬 운영</p><h1>자료 검토</h1><p>공식 근거와 변경 내용을 대조한 뒤 승인하세요. 내보내기는 공개 전 검토용 파일을 만듭니다.</p><button id="refresh">새로고침</button> <button id="export">출판 미리보기 내보내기</button></header>
<p id="message" role="status" aria-live="polite"></p><section aria-label="검토 현황" id="metrics"></section>
<main><section><h2>기존 사례 재검증</h2><button id="new-entry">신규 사례 작성</button><label>사례 검색 <input id="query" type="search"></label><label>검토 묶음 <select id="batch"><option value="all">전체</option><option value="pilot">시범 30건</option><option value="attempted">점검 기록 있음</option></select></label><div id="entries"></div></section>
<section id="editor" aria-label="변경안 작성"><h2 id="entry-heading">사례를 선택하세요</h2><div id="evidence"></div><pre id="before"></pre>
<form id="review-form" hidden><label>운영 상태 <select name="status"><option value="needs_review">확인 필요</option><option value="current">운영 중</option><option value="ended">종료</option></select></label><label>확인일 <input name="checked" type="date" required></label><label>판정 이유·미확인 사유 <textarea name="reason" required maxlength="1000"></textarea></label><label id="new-fields" hidden>신규 사례 정보 JSON <textarea name="newEntry"></textarea></label><label>정정할 필드 JSON (선택) <textarea name="changes">{}</textarea></label><label>공식 근거 URL <input name="url" type="url"></label><button type="button" id="inspect-url">근거 링크 점검·해시 가져오기</button><label>공식 기관 ID <input name="publisher"></label><label>근거 문서 SHA-256 <input name="sha" pattern="[a-f0-9]{64}"></label><label>근거 요약 <textarea name="summary" maxlength="1000"></textarea></label><label><input name="supported" type="checkbox"> 공식 자료가 해당 기간의 운영 상태를 직접 뒷받침함</label><button>변경안 저장</button></form>
<h2>저장된 변경안</h2><div id="drafts"></div></section>
<section><h2>발견 후보</h2><p>채택은 기존 공개 사례와의 근거 연결입니다. 신규 사례 공개를 뜻하지 않습니다.</p><div id="candidates"></div></section></main></body></html>
